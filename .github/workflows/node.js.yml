# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      # 🟢 Setup Node.js inside frontend folder
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
                ./frontend/package-lock.json
                ./backend/package-lock.json

      # 🟢 Set up environment file inside frontend
      - name: Set up .env for frontend
        run: echo "${{ secrets.Frontend_Key }}" > .env
        working-directory: ./frontend
        
      # 🟢 Set up environment file inside backend
      - name: Set up backend .env
        run: |
          printf "%s\n" "${{ secrets.BACKEND_KEY }}" > .env
        working-directory: ./backend
        shell: bash

      # 🟢 Install dependencies inside frontend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      # Install backend dependencies
      - name: Install backend dependencies
        run: npm ci
        working-directory: ./backend

      - name: Delete previous dist folder
        run: sudo rm -rf ./dist
        working-directory: ./frontend

      # 🟢 Build frontend
      - name: Build frontend
        run: npm run build
        working-directory: ./frontend

      - name: Restart backend with PM2
        run: pm2 restart all
        working-directory: ./backend

